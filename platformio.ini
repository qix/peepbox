[platformio]
extra_configs = secrets.ini

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    arduino-libraries/Stepper@^1.1.3
    adafruit/Adafruit NeoPixel @ ^1.12.0
build_flags =
    '-DWIFI_SSID="${secrets.wifi_ssid}"'
    '-DWIFI_PASS="${secrets.wifi_pass}"'

; Wireless updates. First flash must still go over USB (`pio run -t upload`)
; so the device is running OTA-capable firmware; after that:
;   pio run -e ota -t upload
[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = led-wheel.local
