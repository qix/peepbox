[platformio]
extra_configs = secrets.ini

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    arduino-libraries/Stepper@^1.1.3
    adafruit/Adafruit NeoPixel @ ^1.12.0
build_flags =
  -DWIFI_SSID='"${sysenv.WIFI_SSID}"'
  -DWIFI_PASS='"${sysenv.WIFI_PASS}"'
  ; OTA/WiFi is off by default. Build with ENABLE_OTA=1 in the environment to
  ; compile it in, e.g. `ENABLE_OTA=1 pio run -t upload`. Unset/0 leaves all
  ; WiFi + ArduinoOTA code and libraries out of the firmware entirely.
  -DENABLE_OTA=${sysenv.ENABLE_OTA}

# Disable to go back to usb
upload_protocol = espota
upload_port = 192.168.86.103
upload_speed = 115200
upload_flags =
    --auth=wFemjxN28
#led-wheel.local

; Wireless updates. First flash must still go over USB (`pio run -t upload`)
; so the device is running OTA-capable firmware; after that:
;   pio run -e ota -t upload

# [env:ota]
# extends = env:esp32dev
